name: opportunity-board
services:
  board:
    build:
      context: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      HOST: 0.0.0.0
      PORT: "4318"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
# The launcher generates persistent mounts and port settings outside the repo.
